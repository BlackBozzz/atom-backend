
# ============================================================
# ATOM BACKEND
# ============================================================

spring.application.name=atom-backend
server.port=${SERVER_PORT:8080}

# ============================================================
# POSTGRESQL
# ============================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE
# ============================================================

# Hibernate ?? ??????? ??????? ?????????????.
spring.jpa.hibernate.ddl-auto=none

# ????????? ?????????? JPA-?????? ?? ????????? HTTP-??????.
spring.jpa.open-in-view=false

# ????? PostgreSQL ?? ?????????.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:test}

# ============================================================
# FLYWAY
# ============================================================

# ???????? ?????? ??????????.
# ???????? service-common ??????????? ??????????? ????????.
spring.flyway.locations=classpath:db/migration/app

spring.flyway.enabled=true
spring.flyway.default-schema=${DB_SCHEMA:test}
spring.flyway.schemas=${DB_SCHEMA:test}

# ============================================================
# AUTHENTICATION / SECURITY
# ============================================================

# ??????????? ?? ?????? ? ??????.
argent.auth.password-required=true

# ?????????????? ?????????????.
argent.auth.bootstrap-admin.login=${ARGENT_ADMIN_LOGIN:admin}

# ??????????? ???????? ????? ?????????? ?????????.
argent.auth.bootstrap-admin.password=${ARGENT_ADMIN_PASSWORD}

# ???? ????????? ????? ??????????.
argent.auth.roles-file=classpath:argent-roles.json

# ?????????????? ???????? ??????????.
argent.security.actions=showcase.publish,import,orders.approve

# ============================================================
# FILES / ATTACHMENTS
# ============================================================

# ??????????? ??????????? ??????.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:21MB}

# ??????? ???????? ????????.
argent.attachments.root=${ARGENT_ATTACHMENTS_ROOT:./data/attachments}

# ============================================================
# JASPER REPORTS
# ============================================================

# ?????????? ???????? ??? ???????.
argent.reports.preload=classpath*:reports/*.jrxml

# ============================================================
# WEBSOCKET / LIVE ADMIN
# ============================================================

argent.live.enabled=${ARGENT_LIVE_ENABLED:true}
argent.live.flush-ms=${ARGENT_LIVE_FLUSH_MS:500}
argent.live.allowed-origins=${ARGENT_LIVE_ALLOWED_ORIGINS:http://localhost:4200}

# ============================================================
# MAIL
# ============================================================

# ????? ????????? ?? ????????? SMTP.
argent.mail.enabled=${ARGENT_MAIL_ENABLED:false}

# ============================================================
# CONFIGURATION VALIDATION
# ============================================================

argent.config-validation.enabled=true
argent.config-validation.unknown-keys=warn
argent.config-validation.report-on-start=true


argent.queue.enabled=true
argent.queue.poll-interval-ms=2000
argent.queue.heartbeat-interval-ms=15000
argent.queue.lease-seconds=60
argent.queue.max-concurrent-queues=8

# --- Синхронизация с внешней БД ---
app.external-sync.enabled=true
app.external-sync.poll-interval-ms=60000
app.external-sync.batch-size=500

# --- Внешняя БД ---
app.external-db.url=jdbc:postgresql://as.start:5432/main
app.external-db.username=anon
app.external-db.password=anon
app.external-db.driver-class-name=org.postgresql.Driver
app.external-db.hikari.connection-timeout=5000
app.external-db.hikari.validation-timeout=2000
app.external-db.hikari.initialization-fail-timeout=-1